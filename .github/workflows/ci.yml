name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      RAYO_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with: { crystal: 1.22.1 }
      - run: crystal tool format --check src spec examples
      # Many specs start servers back to back and io_uring frees ring memory lazily, so the
      # default 8 MB RLIMIT_MEMLOCK (counted on the runner's kernel) runs out mid-suite.
      - run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          crystal spec
          crystal spec -Dgc_none
